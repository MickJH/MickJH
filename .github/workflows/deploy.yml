name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the GitHub heatmap and footer year stay current.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # Read-only fine-grained token; only used at build time by src/lib/github.ts.
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}

      - name: Check that no token ended up in the output
        if: env.GH_CONTRIBUTIONS_TOKEN != ''
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
        run: |
          if grep -rqF "$GH_CONTRIBUTIONS_TOKEN" out; then
            echo "::error::Token found in build output"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
